<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the game fit phone screens instead of zooming out. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Trapocalypse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The game draws everything onto this canvas, like a painting we redraw 60 times a second. -->
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Little text box in the corner. Useful for messages like "You made it!" -->
    <div id="hud"></div>
    <div id="build-hud">
      <strong id="build-title">BUILD PHASE</strong>
      <span id="build-instructions">Place traps for the other runner.</span>
      <button id="start-run" type="button">Start Run</button>
    </div>

    <!-- Color picker shown at the start of every online round. main.js fills in the 24 swatches. -->
    <div id="color-picker" class="hidden">
      <strong>PICK YOUR COLOR</strong>
      <div id="swatches"></div>
      <span id="color-note">Taken colors are crossed out.</span>
    </div>

    <!-- The lobby: who is here, the match settings, and the host's start button. -->
    <div id="lobby" class="hidden">
      <strong id="lobby-title">ROOM ------</strong>
      <span id="lobby-settings"></span>
      <ul id="lobby-players"></ul>
      <button id="start-match" type="button" class="hidden">Start Trap Apocalypse</button>
      <span id="lobby-note"></span>
    </div>
  </div>

  <!-- Shown whenever you are in a room. Takes you back to this page as it is on load. -->
  <button id="leave-room" type="button" class="hidden">Leave Room</button>

  <section id="online-panel" aria-label="Online multiplayer">
    <strong>ONLINE RUN</strong>
    <input id="player-name" maxlength="18" placeholder="Your name" aria-label="Your name">
    <input id="room-code" maxlength="6" placeholder="Room code" aria-label="Room code">
    <!-- Match settings. Only used by Create Room; the host picks them once for the whole match. -->
    <fieldset id="match-settings">
      <legend>Match settings (host)</legend>
      <label>Time limit
        <select id="set-time">
          <option value="30">30 s</option><option value="45">45 s</option><option value="60" selected>60 s</option>
          <option value="90">90 s</option><option value="120">120 s</option><option value="null">Infinite</option>
          <option value="custom">Custom…</option>
        </select>
        <input id="set-time-custom" type="number" min="30" max="600" step="1" placeholder="30–600" class="hidden">
      </label>
      <label>Points to win
        <select id="set-points">
          <option value="20">20</option><option value="30">30</option><option value="45" selected>45</option>
          <option value="60">60</option><option value="99">99</option><option value="custom">Custom…</option>
        </select>
        <input id="set-points-custom" type="number" min="15" max="99" step="1" placeholder="15–99" class="hidden">
      </label>
      <label>Round cap
        <select id="set-rounds">
          <option value="5">5</option><option value="10">10</option><option value="15">15</option>
          <option value="20">20</option><option value="30" selected>30</option><option value="60">60</option>
          <option value="custom">Custom…</option>
        </select>
        <input id="set-rounds-custom" type="number" min="3" max="60" step="1" placeholder="3–60" class="hidden">
      </label>
    </fieldset>
    <div>
      <button id="create-room" type="button">Create Room</button>
      <button id="join-room" type="button">Join Room</button>
    </div>
    <span id="online-status">Create a room or join a friend.</span>
  </section>

  <!-- Touch buttons. CSS hides these on devices that have a mouse and keyboard. -->
  <div id="touch-controls">
    <div class="touch-group">
      <button class="touch-btn" data-action="left" aria-label="Move left">&#9664;</button>
      <button class="touch-btn" data-action="right" aria-label="Move right">&#9654;</button>
    </div>
    <div class="touch-group">
      <button class="touch-btn jump" data-action="jump" aria-label="Jump">JUMP</button>
    </div>
  </div>

  <!--
    Scripts load in this order on purpose. Each file adds one piece:
      input.js    reads the keyboard and touch buttons
      physics.js  gravity and "did we bump into something" math
      level.js    where the ground, platforms, start, and flag are
      player.js   the runner: moving, jumping, dying, finishing
      main.js     the game loop that ties it all together
  -->
  <script src="js/input.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/network.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
